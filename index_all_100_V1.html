<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Olimpiadas Matemáticas - Colombia</title>
    <style>
        :root {
            --primary: #2c3e50;
            --accent: #27ae60;
            --light: #ecf0f1;
            --danger: #e74c3c;
            --dark: #34495e;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--light);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
        }
        .container {
            background: white;
            padding: 2.5rem;
            border-radius: 15px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.1);
            width: 100%;
            max-width: 700px;
            text-align: center;
        }
        h1 { color: var(--primary); margin-bottom: 0.5rem; }
        p { color: #7f8c8d; }
        
        .grid-levels {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(100px, 1fr));
            gap: 15px;
            margin-top: 30px;
        }
        
        button {
            cursor: pointer;
            transition: all 0.2s ease;
            font-family: inherit;
        }
        
        .btn-level {
            padding: 15px 10px;
            border: none;
            border-radius: 8px;
            background-color: var(--primary);
            color: white;
            font-size: 1rem;
            font-weight: bold;
        }
        .btn-level:hover { transform: translateY(-3px); box-shadow: 0 5px 15px rgba(44, 62, 80, 0.3); }
        
        .btn-option {
            display: block;
            width: 100%;
            padding: 12px 20px;
            margin: 12px 0;
            background-color: #f8f9fa;
            border: 2px solid #dfe6e9;
            border-radius: 8px;
            color: var(--dark);
            text-align: left;
            font-size: 1.1rem;
        }
        .btn-option:hover:not(:disabled) { border-color: var(--primary); background-color: #eef2f3; }
        
        .correct { background-color: var(--accent) !important; border-color: var(--accent) !important; color: white !important; }
        .wrong { background-color: var(--danger) !important; border-color: var(--danger) !important; color: white !important; }
        
        .hidden { display: none; }
        
        .header-quiz {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            padding-bottom: 10px;
            border-bottom: 2px solid #ecf0f1;
            font-weight: bold;
            color: var(--primary);
        }
        
        #question-text { font-size: 1.3rem; margin: 30px 0; color: #2c3e50; }
        #feedback { min-height: 20px; margin-top: 10px; font-weight: bold; }
        
        .btn-control {
            padding: 10px 25px;
            border: none;
            border-radius: 5px;
            font-weight: bold;
            margin-top: 15px;
        }
    </style>

    <script>
    window.MathJax = {
      tex: { inlineMath: [['$', '$'], ['\\(', '\\)']] },
      svg: { fontCache: 'global' }
    };
    </script>
    <script id="MathJax-script" async src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>
</head>
<body>

<div class="container">
    <div id="start-screen">
        <h1>Olimpiadas Matemáticas</h1>
        <p>Selecciona un nivel de dificultad para comenzar</p>
        <div class="grid-levels" id="level-grid"></div>
    </div>

    <div id="quiz-screen" class="hidden">
        <div class="header-quiz">
            <span id="level-indicator">Nivel 1</span>
            <span id="score-indicator">Puntos: 0</span>
        </div>
        <div id="question-text"></div>
        <div id="options-container"></div>
        <div id="feedback"></div>
        
        <div style="display:flex; justify-content: space-between;">
            <button id="exit-btn" class="btn-control" style="background:#e74c3c; color:white;" onclick="location.reload()">Salir</button>
            <button id="next-btn" class="btn-control hidden" style="background:var(--primary); color:white;" onclick="nextQuestion()">Siguiente</button>
        </div>
    </div>
</div>

    // --- LÓGICA DE LA APP ---
    const app = document.getElementById('app');
    const startScreen = document.getElementById('start-screen');
    const quizScreen = document.getElementById('quiz-screen');
    const levelGrid = document.getElementById('level-grid');
    
    let currentLevel = 1;
    let currentQIndex = 0;
    let score = 0;
    let questions = [];

    // Generar botones de niveles
    for (let i = 1; i <= 10; i++) {
        let btn = document.createElement('button');
        btn.className = 'btn-level';
        btn.innerHTML = `Nivel ${i}<br><small style="font-weight:normal; font-size:0.8em">Dificultad ${i}</small>`;
        btn.onclick = () => startLevel(i);
        levelGrid.appendChild(btn);
    }

    function startLevel(level) {
        currentLevel = level;
        questions = db[level];
        currentQIndex = 0;
        score = 0;
        
        startScreen.classList.add('hidden');
        quizScreen.classList.remove('hidden');
        updateScoreUI();
        loadQuestion();
    }

    function loadQuestion() {
        const qData = questions[currentQIndex];
        const qText = document.getElementById('question-text');
        const optsDiv = document.getElementById('options-container');
        const nextBtn = document.getElementById('next-btn');
        const feedback = document.getElementById('feedback');

        // Reset UI
        feedback.innerText = "";
        nextBtn.classList.add('hidden');
        optsDiv.innerHTML = "";
        document.getElementById('level-indicator').innerText = `Nivel ${currentLevel} - Pregunta ${currentQIndex + 1}/10`;
        
        // Render Pregunta
        qText.innerHTML = `<span style="color:#7f8c8d; font-size:0.9rem; text-transform:uppercase; letter-spacing:1px">${qData.topic}</span><br>${qData.q}`;
        
        // Render Opciones
        qData.options.forEach((opt, index) => {
            let btn = document.createElement('button');
            btn.className = 'btn-option';
            btn.innerHTML = opt;
            btn.onclick = () => checkAnswer(index, qData.ans, btn);
            optsDiv.appendChild(btn);
        });

        // Renderizar Matemáticas
        if(window.MathJax) MathJax.typesetPromise();
    }

    function checkAnswer(selected, correct, btnElement) {
        const opts = document.querySelectorAll('.btn-option');
        opts.forEach(b => b.disabled = true);

        if (selected === correct) {
            btnElement.classList.add('correct');
            score += 10;
            document.getElementById('feedback').innerHTML = "<span style='color:#27ae60'>¡Correcto!</span>";
        } else {
            btnElement.classList.add('wrong');
            opts[correct].classList.add('correct');
            document.getElementById('feedback').innerHTML = "<span style='color:#e74c3c'>Incorrecto</span>";
        }
        
        updateScoreUI();
        document.getElementById('next-btn').classList.remove('hidden');
    }

    function updateScoreUI() {
        document.getElementById('score-indicator').innerText = `Puntos: ${score}`;
    }

    function nextQuestion() {
        currentQIndex++;
        if (currentQIndex < questions.length) {
            loadQuestion();
        } else {
            showResults();
        }
    }

    function showResults() {
        const container = document.getElementById('question-text');
        const optsDiv = document.getElementById('options-container');
        const nextBtn = document.getElementById('next-btn');
        const feedback = document.getElementById('feedback');
        
        const passed = score >= 60;
        let msg = passed ? "¡Felicidades! Has aprobado este nivel." : "Buen intento, sigue practicando.";
        let color = passed ? "#27ae60" : "#e74c3c";

        container.innerHTML = `<h2 style="color:${color}">${passed ? '¡Nivel Completado!' : 'Nivel Finalizado'}</h2>
                               <p style="font-size:1.5rem; color:#2c3e50">Puntaje Final: <b>${score}/100</b></p>
                               <p>${msg}</p>`;
        
        optsDiv.innerHTML = `<button class="btn-control" style="background:var(--dark); color:white" onclick="location.reload()">Volver al Inicio</button>`;
        nextBtn.classList.add('hidden');
        feedback.innerHTML = "";
        document.getElementById('level-indicator').innerText = `Nivel ${currentLevel} - Finalizado`;
    }
</script>

</body>
</html>
